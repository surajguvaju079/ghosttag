services:
  postgres:
    image: postgres:17
    container_name: ghosttag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ghosttag 
      POSTGRES_USER: ghosttag 
      POSTGRES_PASSWORD: ghosttag_dev

    ports: 
      - "5432:5432"
    
    volumes:
      - ghosttag_postgres_data:/var/lib/postgresql/data


    healthcheck:
      test: ["CMD-SHELL",'pg_isready -U ghosttag -d ghosttag']
      interval: 5s
      timeout : 5s
      retries: 10

volumes:
  ghosttag_postgres_data:
